<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Digital</title>
    
    <!-- Librerías de descompresión -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-light: #f8fafc;
            --card-light: #ffffff;
            --text-light: #0f172a;
            --text-muted-light: #64748b;
            --border-light: #e2e8f0;
            --accent: #4f46e5;
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --shadow-subtle: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
            --radius-main: 24px;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-light);
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-font-smoothing: antialiased;
        }

        /* --- MODO OSCURO ULTRA REFINADO --- */
        body.dark-mode {
            --bg-light: #09090b;
            --card-light: #18181b;
            --text-light: #f4f4f5;
            --text-muted-light: #a1a1aa;
            --border-light: #27272a;
            --shadow-subtle: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        header {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 20px 16px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-light);
            transition: all 0.4s ease;
        }

        body.dark-mode header {
            background-color: rgba(24, 24, 27, 0.85);
        }

        #btn-back {
            position: absolute;
            top: 24px;
            left: 20px;
            background: rgba(79, 70, 229, 0.1);
            color: var(--accent);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
        }
        #btn-back:hover { background: var(--accent); color: white; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3); }

        #restaurant-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--card-light);
            box-shadow: var(--shadow-card);
            display: inline-block;
            margin-bottom: 8px;
            transition: transform 0.3s ease;
        }
        #restaurant-logo:hover { transform: scale(1.05); }

        #restaurant-name {
            font-size: 2.2em;
            margin: 0 0 8px 0;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .restaurant-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-bottom: 18px;
            font-size: 0.9em;
            color: var(--text-muted-light);
            font-weight: 500;
        }
        .restaurant-meta-item { display: flex; align-items: center; gap: 6px; }
        .restaurant-meta a { color: inherit; text-decoration: none; transition: color 0.2s; }
        .restaurant-meta a:hover { color: var(--accent); }
        .meta-icon { width: 16px; height: 16px; fill: currentColor; opacity: 0.8; }

        .search-container {
            max-width: 450px;
            margin: 0 auto 16px auto;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border-radius: 18px;
            border: 1px solid var(--border-light);
            background-color: var(--card-light);
            color: var(--text-light);
            font-family: inherit;
            font-size: 0.95em;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            box-shadow: var(--shadow-subtle);
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted-light);
            width: 18px;
            height: 18px;
        }

        .top-buttons { display: flex; gap: 10px; justify-content: center; align-items: center; }

        .lang-selector-wrap {
            display: flex; align-items: center; gap: 8px; padding: 8px 14px;
            border-radius: 14px; background: var(--card-light); border: 1px solid var(--border-light);
            cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow-subtle);
        }
        .lang-selector-wrap:hover { border-color: var(--accent); transform: translateY(-1px); }
        .lang-flag { width: 22px; height: 16px; border-radius: 4px; object-fit: cover; }
        #language-selector {
            border: none; background: transparent; font-size: 0.95em; font-weight: 600;
            color: var(--text-light); font-family: inherit; cursor: pointer; padding-right: 4px; outline: none; appearance: none;
        }

        .btn {
            padding: 10px 18px; border-radius: 14px; border: none; cursor: pointer;
            font-weight: 700; font-family: inherit; display: flex; align-items: center;
            gap: 6px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow-subtle);
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-pdf { background: #ef4444; color: white; box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4); }
        .btn-pdf:hover { background: #dc2626; box-shadow: 0 15px 25px -5px rgba(239, 68, 68, 0.5); }
        
        .btn-theme {
            background: var(--card-light); color: var(--text-light); border: 1px solid var(--border-light);
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; justify-content: center; align-items: center; font-size: 1.2em;
            box-shadow: var(--shadow-subtle); cursor: pointer; transition: all 0.3s ease;
        }
        .btn-theme:hover { transform: translateY(-2px) rotate(10deg); border-color: var(--accent); }

        .category-tabs-container {
            width: 100%;
            padding: 4px 20px 12px 20px;
            box-sizing: border-box;
            display: none;
        }
        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            -ms-overflow-style: none;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .category-tab {
            padding: 9px 20px;
            border-radius: 16px;
            background-color: var(--card-light);
            color: var(--text-muted-light);
            font-weight: 600;
            font-size: 0.92em;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-subtle);
        }
        .category-tab:hover { background-color: rgba(79, 70, 229, 0.05); color: var(--accent); border-color: rgba(79, 70, 229, 0.2); }
        .category-tab.active {
            background: var(--accent-gradient);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            transform: translateY(-2px);
        }

        .cart-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            background: var(--accent-gradient);
            color: white;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 20px 30px -10px rgba(79, 70, 229, 0.5);
            cursor: pointer;
            z-index: 999;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }
        .cart-fab:hover { transform: scale(1.1) rotate(5deg); }
        .cart-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #ef4444;
            color: white;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--bg-light);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0);
        }
        .cart-badge.visible { transform: scale(1); }

        #cart-items-container { max-height: 45vh; overflow-y: auto; margin: 16px 0; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); padding: 12px 0; }
        .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 6px; border-bottom: 1px solid var(--border-light); }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-name { font-weight: 600; flex-grow: 1; margin-right: 12px; font-size: 0.98em; }
        .cart-item-controls { display: flex; align-items: center; gap: 10px; user-select: none; }
        .cart-item-quantity { font-weight: 700; min-width: 24px; text-align: center; }
        .cart-item-price { font-weight: 700; color: var(--accent); min-width: 70px; text-align: right; }
        .quantity-btn { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--border-light); background: var(--card-light); color: var(--text-light); font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .quantity-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
 
        #table-selector-container { margin-top: 16px; }
        #table-selector-container label { font-weight: 600; font-size: 0.88em; color: var(--text-muted-light); }

        #main-content {
            padding: 30px 20px;
            max-width: 900px;
            margin: 0 auto;
            min-height: 70vh;
            padding-bottom: 100px; 
        }
        #loader { text-align: center; padding: 60px; font-size: 1.2em; color: var(--text-muted-light); font-weight: 600; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 10px;
        }
        .menu-card {
            border-radius: var(--radius-main);
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            cursor: pointer;
            position: relative;
            height: 240px; 
            border: 1px solid var(--border-light);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .menu-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-card); border-color: rgba(79, 70, 229, 0.3); }
        .menu-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0; z-index: 1;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .menu-card-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
            z-index: 2;
            display: flex;
            align-items: flex-end;
            padding: 24px;
            box-sizing: border-box;
            transition: background 0.3s ease;
        }
        .menu-card:hover .menu-card-img { transform: scale(1.08); }
        .menu-card-title {
            color: #ffffff;
            font-size: 1.8em;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        .category { margin-bottom: 45px; }
        .category-title {
            font-size: 1.6em; font-weight: 800; color: var(--text-light);
            display: inline-block; position: relative; margin-bottom: 24px;
            letter-spacing: -0.02em;
        }
        .category-title::after {
            content: ''; position: absolute; left: 0; bottom: -8px; width: 45px; height: 4px;
            background: var(--accent-gradient); border-radius: 4px;
        }

        .dish {
            display: flex; gap: 20px; background-color: var(--card-light); border-radius: var(--radius-main);
            box-shadow: var(--shadow-subtle); margin-bottom: 18px; overflow: hidden;
            cursor: pointer; border: 1px solid var(--border-light);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dish:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); border-color: rgba(79, 70, 229, 0.3); }
        .dish-img { width: 140px; height: 140px; object-fit: cover; flex-shrink: 0; transition: transform 0.5s ease; }
        .dish:hover .dish-img { transform: scale(1.05); }
        .dish-details { padding: 18px 18px 18px 0; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .dish:not(:has(.dish-img)) .dish-details { padding-left: 20px; }
        .dish-name { font-size: 1.2em; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; color: var(--text-light); }
        .dish-desc {
            color: var(--text-muted-light); margin: 0 0 14px; font-size: 0.93em; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .dish-bottom-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .dish-price { font-size: 1.35em; font-weight: 800; color: var(--text-light); letter-spacing: -0.02em; }
        
        .dish-add-btn {
            background: var(--accent-gradient);
            color: white; border: none; width: 42px; height: 42px;
            border-radius: 14px; font-size: 22px; font-weight: 700; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 8px 20px -5px rgba(79, 70, 229, 0.4);
        }
        .dish-add-btn:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 12px 25px -5px rgba(79, 70, 229, 0.6); }

        .dish-action-icon {
            background: rgba(79, 70, 229, 0.08); color: var(--accent); border-radius: 14px;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .dish:hover .dish-action-icon {
            background: var(--accent); color: #ffffff; transform: translateX(4px);
            box-shadow: 0 8px 20px -5px rgba(79, 70, 229, 0.4);
        }
        .dish-source-badge { font-size: 0.7em; background: rgba(0,0,0,0.05); padding: 4px 8px; border-radius: 8px; color: var(--text-muted-light); font-weight: 600; margin-left: 8px; }
        body.dark-mode .dish-source-badge { background: rgba(255,255,255,0.08); }

        .fade-in-slide {
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-in-slide.visible { opacity: 1; transform: translateY(0); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.35s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--card-light); border-radius: 32px; width: 90%; max-width: 440px; max-height: 85vh;
            overflow-y: auto; position: relative; transform: translateY(30px) scale(0.95);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 30px 60px rgba(0,0,0,0.25);
            border: 1px solid var(--border-light);
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        .modal-close {
            position: absolute; top: 18px; right: 18px; background: rgba(0, 0, 0, 0.05); color: var(--text-light);
            border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 1em;
            cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        body.dark-mode .modal-close { background: rgba(255, 255, 255, 0.08); }
        .modal-close:hover { background: #ef4444; color: white; transform: scale(1.1); }
        
        .modal-img-wrapper { text-align: center; padding-top: 30px; }
        .modal-img {
            width: 160px; height: 160px; object-fit: cover; border-radius: 28px;
            box-shadow: var(--shadow-card); display: inline-block; border: 4px solid var(--card-light);
        }
        .modal-body { padding: 24px 32px 32px; text-align: center; }
        .modal-title { font-size: 1.7em; font-weight: 800; margin: 0 0 12px; line-height: 1.15; letter-spacing: -0.02em; color: var(--text-light); }
        .modal-price {
            font-size: 1.6em; font-weight: 800; color: var(--accent); display: inline-block;
            padding: 8px 24px; background: rgba(79, 70, 229, 0.08); border-radius: 14px;
            letter-spacing: -0.02em; margin-bottom: 20px;
        }
        .modal-desc { color: var(--text-muted-light); font-size: 1.02em; line-height: 1.6; margin: 0; }

        #cookie-banner {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.08);
            padding: 18px 24px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 9999; border-top: 1px solid var(--border-light);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #cookie-banner.show { transform: translateY(0); }
        body.dark-mode #cookie-banner { background: rgba(24, 24, 27, 0.9); }
        .cookie-text { font-size: 0.9em; margin-right: 20px; line-height: 1.4; color: var(--text-muted-light); }
        .btn-cookie {
            background: var(--accent-gradient); color: #fff; border: none; padding: 12px 24px;
            border-radius: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
            white-space: nowrap; transition: all 0.3s ease; box-shadow: 0 8px 20px -5px rgba(79, 70, 229, 0.4);
        }
        .btn-cookie:hover { transform: translateY(-2px); box-shadow: 0 12px 25px -5px rgba(79, 70, 229, 0.6); }

        @media (max-width: 480px) {
            header { padding: 16px 12px; }
            #btn-back { top: 16px; left: 12px; width: 40px; height: 40px; border-radius: 12px; }
            #restaurant-logo { width: 65px; height: 65px; }
            #restaurant-name { font-size: 1.6em; }
            .restaurant-meta { gap: 8px 12px; font-size: 0.8em; margin-bottom: 12px; }
            .search-input { padding: 12px 16px 12px 40px; font-size: 0.9em; }
            .top-buttons { gap: 8px; }
            .lang-selector-wrap { padding: 6px 10px; }
            .btn-pdf { padding: 8px 12px; font-size: 0.8em; }
            .btn-theme { width: 40px; height: 40px; }
            #cookie-banner { flex-direction: column; text-align: center; gap: 14px; }
            .cookie-text { margin-right: 0; }
            .btn-cookie { width: 100%; }
        }
    </style>
</head>

<body>

<header id="header-container" style="display:none;">
    <button id="btn-back" onclick="app.navigateHome()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <img id="restaurant-logo" src="" alt="Logo">
    <h1 id="restaurant-name">Cargando...</h1>
    
    <div id="restaurant-meta" class="restaurant-meta"></div>

    <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Buscar platos..." oninput="app.handleSearch(this.value)">
    </div>

    <div id="category-tabs-container" class="category-tabs-container">
        <div id="category-tabs" class="category-tabs"></div>
    </div>

    <div class="top-buttons">
        <div class="lang-selector-wrap">
            <img id="current-flag" class="lang-flag" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <select id="language-selector" aria-label="Selector de idioma"></select>
        </div>
        <button id="btn-pdf" class="btn btn-pdf" onclick="window.print()">📄 PDF</button>
        <button id="btn-theme" class="btn-theme" onclick="app.toggleTheme()">🌙</button>
    </div>
</header>

<div id="main-content">
    <div id="loader">Preparando la experiencia gastronómica...</div>
</div>

<div id="dish-modal" class="modal-overlay" onclick="app.closeModal(event)">
    <div class="modal-content">
        <button id="modal-close" class="modal-close" onclick="app.closeModal(event, true)">✕</button>
        <div id="modal-img-wrapper" class="modal-img-wrapper">
            <img id="modal-img" class="modal-img" src="" alt="">
        </div>
        <div class="modal-body">
            <h3 id="modal-title" class="modal-title"></h3>
            <div id="modal-price" class="modal-price"></div>
            <p id="modal-desc" class="modal-desc"></p>
        </div>
    </div>
</div>

<div id="cookie-banner">
    <div id="cookie-text" class="cookie-text"></div>
    <button id="cookie-btn" class="btn-cookie" onclick="app.acceptCookies()"></button>
</div>

<div id="cart-fab" class="cart-fab" onclick="app.openCart()">
    🛒
    <span id="cart-badge" class="cart-badge">0</span>
</div>

const DEFAULT_COVERS = {
    normal: "assets/principal/normal.jpg",
    diario: "assets/principal/diario.jpg",
    especial: "assets/principal/especial.jpg"
};

const app = {
    data: null,
    currentLang: 'es',
    currentView: 'home', 
    currentMenuId: null,
    searchQuery: '',
    categoryTabsObserver: null,
    cart: [],
    whatsapp: { enabled: false, phone: '', msgLang: 'es' },
    tables: [],

    dom: {
        header: document.getElementById('header-container'),
        content: document.getElementById('main-content'),
        btnBack: document.getElementById('btn-back'),
        logo: document.getElementById('restaurant-logo'),
        name: document.getElementById('restaurant-name'),
        meta: document.getElementById('restaurant-meta'),
        langSelect: document.getElementById('language-selector'),
        currentFlag: document.getElementById('current-flag'),
        searchInput: document.getElementById('search-input'),
        categoryTabsContainer: document.getElementById('category-tabs-container'),
        categoryTabs: document.getElementById('category-tabs'),
        modal: document.getElementById('dish-modal'),
        mImgWrapper: document.getElementById('modal-img-wrapper'),
        mImg: document.getElementById('modal-img'),
        mTitle: document.getElementById('modal-title'),
        mPrice: document.getElementById('modal-price'),
        mDesc: document.getElementById('modal-desc'),
        cookieBanner: document.getElementById('cookie-banner'),
        cookieText: document.getElementById('cookie-text'),
        cookieBtn: document.getElementById('cookie-btn'),
        cartFab: document.getElementById('cart-fab'),
        cartBadge: document.getElementById('cart-badge'),
        cartModal: document.getElementById('cart-modal'),
        cartModalTitle: document.getElementById('cart-modal-title'),
        cartTotalLabel: document.getElementById('cart-total-label'),
        cartTableLabel: document.getElementById('cart-table-label'),
        cartItemsContainer: document.getElementById('cart-items-container'),
        cartTotalPrice: document.getElementById('cart-total-price'),
        tableSelector: document.getElementById('table-selector'),
        sendOrderBtn: document.getElementById('send-order-btn')
    },

    async init() {
        const t = I18N[this.currentLang] || I18N['es'];
        try {
            const hash = window.location.hash.substring(1);
            if (!hash) throw new Error(t.invalidQR);

            let jsonData;
            if (hash.startsWith('pako:')) {
                jsonData = this.decompressPako(hash.substring(5));
            } else if (hash.startsWith('restaurant:')) {
                const id = hash.replace('restaurant:', '');
                jsonData = await this.fetchRemote(id, 'restaurants');
            } else if (hash.startsWith('remote:')) {
                const id = hash.replace('remote:', '');
                jsonData = await this.fetchRemote(id, 'menus');
            } else {
                jsonData = await this.fetchRemote(hash, 'restaurants');
            }

            if (!jsonData.menus) {
                this.data = {
                    restaurantInfo: {
                        nombre: jsonData.nombreRestaurante || '',
                        logoBase64: jsonData.logoRestaurante || '',
                        telefono: jsonData.telefonoRestaurante,
                        direccion: jsonData.direccionRestaurante,
                        email: jsonData.emailRestaurante,
                        currency: jsonData.currency || 'EUR'
                    },
                    menus: [jsonData] 
                };
            } else {
                this.data = jsonData;
            }

            this.setupUI();
        } catch (error) {
            console.error(error);
            const tErr = I18N[this.currentLang] || I18N['es'];
            this.dom.content.innerHTML = `<div style="text-align:center; padding: 60px; color: #ef4444;"><h3>${tErr.errorTitle}</h3><p>${error.message}</p></div>`;
        }
    },

    setupUI() {
        this.dom.header.style.display = 'block';
        const rInfo = this.data.restaurantInfo || {};
        
        if (rInfo.logoBase64) {
            this.dom.logo.src = rInfo.logoBase64;
            this.dom.logo.style.display = 'inline-block';
        } else {
            this.dom.logo.style.display = 'none';
        }

        let metaHtml = '';
        if (rInfo.telefono) {
            const safePhone = this.escapeHTML(rInfo.telefono);
            metaHtml += `<div class="restaurant-meta-item"><svg class="meta-icon" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg><a href="tel:${safePhone}">${safePhone}</a></div>`;
        }
        if (rInfo.email) {
            const safeEmail = this.escapeHTML(rInfo.email);
            metaHtml += `<div class="restaurant-meta-item"><svg class="meta-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg><a href="mailto:${safeEmail}">${safeEmail}</a></div>`;
        }
        if (rInfo.direccion) {
            const safeDir = this.escapeHTML(rInfo.direccion);
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(rInfo.direccion)}`;
            metaHtml += `<div class="restaurant-meta-item"><svg class="meta-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><a href="${mapsUrl}" target="_blank">${safeDir}</a></div>`;
        }
        this.dom.meta.innerHTML = metaHtml;
        this.dom.meta.style.display = metaHtml ? 'flex' : 'none';

        if (rInfo.whatsappEnabled && rInfo.whatsappPhone && rInfo.tables?.length > 0) {
            this.whatsapp.enabled = true;
            this.whatsapp.phone = rInfo.whatsappPhone;
            this.whatsapp.msgLang = rInfo.whatsappMessageLang || 'es';
            this.tables = rInfo.tables;
            this.dom.cartFab.style.display = 'flex';
        }

        const firstMenu = this.data.menus[0];
        if (firstMenu) {
            let rawBrowserLang = navigator.language.split('-')[0].toLowerCase();
            if (rawBrowserLang === 'zh') rawBrowserLang = 'cn';
            if (rawBrowserLang === 'ar') rawBrowserLang = 'sa';
            
            const supportedLangs = Object.keys(I18N);
            this.currentLang = supportedLangs.includes(rawBrowserLang) ? rawBrowserLang : 'en';

            this.dom.langSelect.innerHTML = '';
            const langsToRender = new Set(Object.keys(I18N));
            if (firstMenu.traducciones) {
                Object.keys(firstMenu.traducciones).forEach(l => langsToRender.add(l));
            }

            langsToRender.forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang;
                opt.textContent = firstMenu.traducciones?.[lang]?.meta?.languageName || lang.toUpperCase();
                this.dom.langSelect.appendChild(opt);
            });
            
            this.dom.langSelect.value = this.currentLang;
            this.updateFlag();
        }

        this.dom.langSelect.addEventListener('change', (e) => {
            this.currentLang = e.target.value;
            this.updateFlag();
            this.updateUITexts();
            this.refreshCurrentView();
        });

        this.updateUITexts(); 
        this.initCookies();
        this.navigateHome();
    },

    updateUITexts() {
        const t = I18N[this.currentLang] || I18N['es'];
        const t_wa = I18N_WHATSAPP[this.whatsapp.msgLang] || I18N_WHATSAPP['es'];
        
        this.dom.searchInput.placeholder = t.search;
        this.dom.btnBack.title = t.back;
        this.dom.cartModalTitle.textContent = t.cartTitle;
        this.dom.cartTotalLabel.textContent = t.cartTotal;
        this.dom.cartTableLabel.textContent = t.cartTableLabel;
        this.dom.sendOrderBtn.textContent = t_wa.orderBtn;
        this.dom.cookieText.textContent = t.cookieMsg;
        this.dom.cookieBtn.textContent = t.cookieBtn;
        
        const rInfo = this.data?.restaurantInfo || {};
        this.dom.name.textContent = rInfo.nombre || t.defaultRestaurant;
    },

    initCookies() {
        if (!localStorage.getItem('cookiesAccepted_MenuForge')) {
            setTimeout(() => this.dom.cookieBanner.classList.add('show'), 800);
        }
    },

    acceptCookies() {
        localStorage.setItem('cookiesAccepted_MenuForge', 'true');
        this.dom.cookieBanner.classList.remove('show');
    },

    navigateHome() {
        this.currentView = 'home';
        this.currentMenuId = null;
        this.dom.btnBack.style.display = 'none';
        this.dom.categoryTabsContainer.style.display = 'none';
        if (this.categoryTabsObserver) this.categoryTabsObserver.disconnect();
        
        if (this.searchQuery) {
            this.renderSearch();
        } else {
            this.renderHomeGrid();
        }
    },

    navigateToMenu(menuId) {
        this.currentView = 'menu';
        this.currentMenuId = menuId;
        this.dom.btnBack.style.display = 'flex';
        this.dom.searchInput.value = ''; 
        this.renderMenu(menuId);
    },

    refreshCurrentView() {
        if (this.searchQuery) this.renderSearch();
        else if (this.currentView === 'menu') this.renderMenu(this.currentMenuId);
        else this.renderHomeGrid();
    },

    getMenuTitle(menu) {
        const t = I18N[this.currentLang] || I18N['es'];
        const tipo = menu.tipoMenu || menu.tipo;
        
        if (tipo === 'diario') return t["menu_diario"] || "📅 Menú del Día";
        if (tipo === 'especial') return t["menu_especial"] || "⭐ Carta de Especiales";

        let trans = menu.traducciones?.[this.currentLang];
        if (!trans && menu.traducciones) {
            trans = menu.traducciones[Object.keys(menu.traducciones)[0]];
        }
        return trans?.nombreCarta || menu.nombreCarta || t.defaultMenu;
    },

    renderHomeGrid() {
        const menus = this.data.menus || [];
        const t = I18N[this.currentLang] || I18N['es'];
        
        if (menus.length === 0) {
            this.dom.content.innerHTML = `<div id="loader">${t.emptyMenu}</div>`;
            return;
        }

        if (menus.length === 1 && !this.searchQuery) {
            this.navigateToMenu(menus[0].id);
            this.dom.btnBack.style.display = 'none';
            return;
        }

        let html = '<div class="menu-grid">';
        menus.forEach(menu => {
            const tipo = (menu.tipoMenu || menu.tipo || 'normal').toLowerCase();
            const coverImg = DEFAULT_COVERS[tipo] || DEFAULT_COVERS.normal;
            const noCacheImg = `${coverImg}?t=${new Date().getTime()}`;
            const menuName = this.getMenuTitle(menu);

            html += `
                <div class="menu-card fade-in-slide" onclick="app.navigateToMenu('${menu.id}')">
                    <img class="menu-card-img" src="${noCacheImg}" alt="${this.escapeHTML(menuName)}" loading="lazy">
                    <div class="menu-card-overlay">
                        <h2 class="menu-card-title">${this.escapeHTML(menuName)}</h2>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        this.dom.content.innerHTML = html;
        this.initScrollAnimations();
        window.scrollTo(0,0);
    },

    getCategoryName(catKey, originalName) {
        const t = I18N[this.currentLang] || I18N['es'];
        if (catKey && t[catKey]) {
            return t[catKey];
        }
        return originalName;
    },

    renderMenu(menuId) {
        const menu = this.data.menus.find(m => m.id === menuId);
        if (!menu) return this.navigateHome();
        const t = I18N[this.currentLang] || I18N['es'];

        let trans = menu.traducciones?.[this.currentLang];
        if (!trans && menu.traducciones) {
            trans = menu.traducciones[Object.keys(menu.traducciones)[0]];
        }

        if (!trans || !trans.categorias || trans.categorias.length === 0) {
            this.dom.content.innerHTML = `<div id="loader">${t.emptyMenu}</div>`;
            this.dom.categoryTabs.innerHTML = '';
            this.dom.categoryTabsContainer.style.display = 'none';
            return;
        }

        this.dom.categoryTabsContainer.style.display = 'block';
        const images = menu.recursos?.imagenes || {};
        let html = '';
        let tabsHtml = '';

        for (let catIndex = 0; catIndex < trans.categorias.length; catIndex++) {
            const cat = trans.categorias[catIndex];
            const catKey = cat.key;
            const translatedCatName = this.getCategoryName(catKey, cat.nombre);
            
            const categorySlug = this.slugify(translatedCatName || cat.nombre);
            tabsHtml += `<div class="category-tab" data-target="${categorySlug}">${this.escapeHTML(translatedCatName)}</div>`;

            html += `<div id="${categorySlug}" class="category fade-in-slide">`;
            html += `<h2 class="category-title">${this.escapeHTML(translatedCatName)}</h2>`;
            if (cat.platos) {
                for (let dishIndex = 0; dishIndex < cat.platos.length; dishIndex++) {
                    const dish = cat.platos[dishIndex];
                    html += this.generateDishCardHTML(dish, images, null, menu.id, catIndex, dishIndex);
                }
            }
            html += `</div>`;
        }

        this.dom.categoryTabs.innerHTML = tabsHtml;
        
        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const targetId = tab.getAttribute('data-target');
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    const headerHeight = this.dom.header.offsetHeight;
                    const targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - headerHeight;
                    window.scrollTo({ top: targetPosition, behavior: 'smooth' });
                }
            });
        });

        if (this.categoryTabsObserver) this.categoryTabsObserver.disconnect();
        const observerOptions = {
            root: null,
            rootMargin: `-${this.dom.header.offsetHeight + 20}px 0px 0px 0px`,
            threshold: 0.6
        };
        this.categoryTabsObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const id = entry.target.getAttribute('id');
                const tab = document.querySelector(`.category-tab[data-target="${id}"]`);
                if (tab) tab.classList.toggle('active', entry.isIntersecting);
            });
        }, observerOptions);
        document.querySelectorAll('.category').forEach(section => this.categoryTabsObserver.observe(section));

        this.dom.content.innerHTML = html;
        this.initScrollAnimations();
        window.scrollTo(0,0);
    },

    handleSearch(query) {
        this.searchQuery = query.trim().toLowerCase();
        if (!this.searchQuery) {
            this.refreshCurrentView();
            return;
        }
        this.renderSearch();
    },

    renderSearch() {
        let resultsHTML = '';
        const foundKeys = new Set();
        const t = I18N[this.currentLang] || I18N['es'];

        this.dom.btnBack.style.display = 'flex';
        this.dom.categoryTabsContainer.style.display = 'none';
        if (this.categoryTabsObserver) this.categoryTabsObserver.disconnect();

        this.data.menus.forEach(menu => {
            if (!menu.traducciones) return;
            const images = menu.recursos?.imagenes || {};
            const displayMenuName = this.getMenuTitle(menu);

            for (const lang in menu.traducciones) {
                const trans = menu.traducciones[lang];
                if (trans && trans.categorias) {
                    for (let catIndex = 0; catIndex < trans.categorias.length; catIndex++) {
                        const cat = trans.categorias[catIndex];
                        if (cat.platos) {
                            for (let dishIndex = 0; dishIndex < cat.platos.length; dishIndex++) {
                                const dish = cat.platos[dishIndex];
                                const name = (dish.nombre || '').toLowerCase();
                                const desc = (dish.descripcion || '').toLowerCase();
                                
                                if (name.includes(this.searchQuery) || desc.includes(this.searchQuery)) {
                                    const key = `${menu.id}-${catIndex}-${dishIndex}`;
                                    if (!foundKeys.has(key)) {
                                        foundKeys.add(key);
                                        const displayDish = menu.traducciones[this.currentLang]?.categorias[catIndex]?.platos[dishIndex];
                                        if (displayDish) {
                                            resultsHTML += this.generateDishCardHTML(displayDish, images, displayMenuName, menu.id, catIndex, dishIndex);
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        });

        if (foundKeys.size === 0) {
            this.dom.content.innerHTML = `<div id="loader">${t.emptySearch} "${this.escapeHTML(this.searchQuery)}"</div>`;
        } else {
            this.dom.content.innerHTML = `
                <div class="category fade-in-slide">
                    <h2 class="category-title">${t.results} (${foundKeys.size})</h2>
                    ${resultsHTML}
                </div>
            `;
            this.initScrollAnimations();
        }
    },

    generateDishCardHTML(dish, images, sourceMenuName, menuId, catIndex, dishIndex) {
        const imgUrl = dish.idImagen ? images[dish.idImagen] : '';
        const safeName = this.escapeHTML(dish.nombre);
        const safeDesc = this.escapeHTML(dish.descripcion);
        const safePrice = this.formatPrice(dish.precio);

        const modalData = { name: safeName, desc: safeDesc, price: safePrice, imgUrl };
        const safeModalData = encodeURIComponent(JSON.stringify(modalData));

        let cartDishData = dish;
        if (this.whatsapp.enabled && menuId !== undefined) {
            const menu = this.data.menus.find(m => m.id === menuId);
            const waDish = menu?.traducciones[this.whatsapp.msgLang]?.categorias[catIndex]?.platos[dishIndex];
            if (waDish) {
                cartDishData = {
                    ...dish,
                    nombre_display: dish.nombre,
                    nombre_wa: waDish.nombre,
                    cart_id: `${menuId}-${catIndex}-${dishIndex}`
                };
            }
        }
        const safeCartData = encodeURIComponent(JSON.stringify(cartDishData));

        const actionButton = this.whatsapp.enabled
            ? `<button class="dish-add-btn" onclick="event.stopPropagation(); app.addToCart('${safeCartData}');">+</button>`
            : `<div class="dish-action-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div>`;

        return `
            <div class="dish" onclick="app.openModal('${safeModalData}')">
                ${imgUrl ? `<img class="dish-img" src="${imgUrl}" loading="lazy">` : ''}
                <div class="dish-details">
                    <div class="dish-name">${safeName}</div>
                    ${safeDesc ? `<p class="dish-desc">${safeDesc}</p>` : ''}
                    <div class="dish-bottom-row">
                        <div class="dish-price">${safePrice} ${sourceMenuName ? `<span class="dish-source-badge">${this.escapeHTML(sourceMenuName)}</span>` : ''}</div>
                        ${actionButton}
                    </div>
                </div>
            </div>
        `;
    },

    openModal(safeDataStr) {
        const data = JSON.parse(decodeURIComponent(safeDataStr));
        const t = I18N[this.currentLang] || I18N['es'];
        
        this.dom.mTitle.innerHTML = data.name;
        this.dom.mPrice.innerHTML = data.price;
        this.dom.mDesc.innerHTML = data.desc || `<i>${t.noDescription}</i>`;
        
        if (data.imgUrl) {
            this.dom.mImg.src = data.imgUrl;
            this.dom.mImgWrapper.style.display = 'block';
        } else {
            this.dom.mImg.src = '';
            this.dom.mImgWrapper.style.display = 'none';
        }

        this.dom.modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    },

    closeModal(event, force = false) {
        if (force || event.target === this.dom.modal) {
            this.dom.modal.classList.remove('active');
            document.body.style.overflow = '';
        }
    },

    addToCart(safeCartData) {
        const dish = JSON.parse(decodeURIComponent(safeCartData));
        const uniqueId = dish.cart_id || dish.nombre;
        const existingItem = this.cart.find(item => (item.cart_id || item.nombre) === uniqueId);

        if (existingItem) {
            existingItem.quantity++;
        } else {
            this.cart.push({ ...dish, quantity: 1 });
        }
        this.updateCartBadge();
    },

    updateCartBadge() {
        const totalItems = this.cart.reduce((sum, item) => sum + item.quantity, 0);
        this.dom.cartBadge.textContent = totalItems;
        if (totalItems > 0) {
            this.dom.cartBadge.classList.add('visible');
        } else {
            this.dom.cartBadge.classList.remove('visible');
        }
    },

    openCart() {
        if (!this.whatsapp.enabled) return;
        this.renderCartModal();
        this.dom.cartModal.classList.add('active');
        document.body.style.overflow = 'hidden';
    },

    closeCart(event, force = false) {
        if (force || event.target === this.dom.cartModal) {
            this.dom.cartModal.classList.remove('active');
            document.body.style.overflow = '';
        }
    },

    renderCartModal() {
        const t = I18N[this.currentLang] || I18N['es'];
        let tableOptions = `<option value="">-- ${t.tableSelectDefault} --</option>`;
        const displayLang = this.currentLang;
        const valueLang = this.whatsapp.msgLang;

        this.tables.forEach(table => {
            const displayTableName = table.traducciones?.[displayLang] || table.name;
            const valueTableName = table.traducciones?.[valueLang] || table.name;
            tableOptions += `<option value="${this.escapeHTML(valueTableName)}">${this.escapeHTML(displayTableName)}</option>`;
        });
        this.dom.tableSelector.innerHTML = tableOptions;

        if (this.cart.length === 0) {
            this.dom.cartItemsContainer.innerHTML = `<div style="text-align:center; padding: 25px 0; color: var(--text-muted-light);">${t.cartEmpty}</div>`;
            this.updateCartTotal();
            return;
        }

        let itemsHtml = '';
        this.cart.forEach(item => {
            const uniqueId = this.escapeHTML(item.cart_id || item.nombre);
            const displayName = this.escapeHTML(item.nombre_display || item.nombre);

            itemsHtml += `
                <div class="cart-item">
                    <div class="cart-item-name">${displayName}</div>
                    <div class="cart-item-controls">
                        <button class="quantity-btn" onclick="app.adjustCartQuantity('${uniqueId}', -1)">-</button>
                        <span class="cart-item-quantity">${item.quantity}</span>
                        <button class="quantity-btn" onclick="app.adjustCartQuantity('${uniqueId}', 1)">+</button>
                    </div>
                    <div class="cart-item-price">${this.formatPrice(item.precio * item.quantity)}</div>
                </div>
            `;
        });
        this.dom.cartItemsContainer.innerHTML = itemsHtml;
        this.updateCartTotal();
    },

    adjustCartQuantity(itemId, change) {
        const item = this.cart.find(i => (this.escapeHTML(i.cart_id || i.nombre)) === itemId);
        if (item) {
            item.quantity += change;
            if (item.quantity <= 0) {
                this.cart = this.cart.filter(i => (this.escapeHTML(i.cart_id || i.nombre)) !== itemId);
            }
        }
        this.renderCartModal();
        this.updateCartBadge();
    },

    updateCartTotal() {
        const total = this.cart.reduce((sum, item) => sum + (item.precio * item.quantity), 0);
        this.dom.cartTotalPrice.textContent = this.formatPrice(total);
    },

    sendOrder() {
        const selectedTable = this.dom.tableSelector.value;
        const t_wa = I18N_WHATSAPP[this.whatsapp.msgLang] || I18N_WHATSAPP['es'];
        if (!selectedTable) { alert(t_wa.noTable); return; }
        if (this.cart.length === 0) return;

        const orderItems = this.cart.map(item => {
            const nameForWhatsapp = item.nombre_wa || item.nombre;
            return t_wa.item.replace('{quantity}', item.quantity).replace('{name}', nameForWhatsapp);
        }).join('\n');
        let message = `${t_wa.header.replace('{table}', selectedTable)}\n\n${orderItems}\n\n${t_wa.footer}`;
        window.open(`https://wa.me/${this.whatsapp.phone}?text=${encodeURIComponent(message)}`, '_blank');
    },

    updateFlag() { 
        this.dom.currentFlag.src = `assets/flags/${this.currentLang}.png`; 
    },
    
    toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.getElementById('btn-theme').textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    },
    
    formatPrice(price) {
        if (typeof price !== 'number') return '';
        const currencyCode = (this.data && this.data.restaurantInfo && this.data.restaurantInfo.currency) 
                            ? this.data.restaurantInfo.currency 
                            : 'EUR';
        
        let locale = this.currentLang;
        if (locale === 'cn') locale = 'zh-CN';
        else if (locale === 'sa') locale = 'ar-SA';
        else if (locale === 'en') locale = 'en-US';
        else if (locale === 'pt') locale = 'pt-BR';

        try {
            return price.toLocaleString(locale, { style: 'currency', currency: currencyCode });
        } catch(e) {
            return price.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
        }
    },
    
    escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, match => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[match]));
    },

    slugify(text) {
        if (!text) return '';
        return text.toString().toLowerCase()
            .replace(/\s+/g, '-')          
            .replace(/[^\w\-]+/g, '')      
            .replace(/\-\-+/g, '-')        
            .replace(/^-+/, '')            
            .replace(/-+$/, '');           
    },

    initScrollAnimations() {
        const elements = document.querySelectorAll('.fade-in-slide');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.01 });
        elements.forEach(el => observer.observe(el));
    },

    decompressPako(base64String) {
        const compressed = atob(base64String).split('').map(c => c.charCodeAt(0));
        return JSON.parse(pako.inflate(new Uint8Array(compressed), { to: 'string' }));
    },

    async fetchRemote(id, folder) {
        const workerUrl = window.location.hostname.includes('github.io') || window.location.hostname === 'localhost' 
            ? 'https://wiissdeveloperapps.dpdns.org' 
            : ''; 

        const url = `${workerUrl}/${folder}/${id}.json?t=${Date.now()}`;
        const response = await fetch(url);
        const t = I18N[this.currentLang] || I18N['es'];
        if (!response.ok) throw new Error(t.fetchError);
        
        const rawText = await response.text();
        const decompressed = LZString.decompressFromEncodedURIComponent(rawText);
        return JSON.parse(decompressed || rawText);
    }
};

document.addEventListener('DOMContentLoaded', () => app.init());
</script>
