<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Menú Digital</title>
    
    <!-- Librerías de descompresión -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div id="friendly-toast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span id="toast-text"></span>
</div>

<header id="header-container" style="display:none;">
    <div class="header-top-row">
        <button id="btn-back" onclick="app.goBack()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <img id="restaurant-logo" src="" alt="Logo" style="display:none;">
        <h1 id="restaurant-name"></h1>
        <button id="btn-theme" class="btn-theme-header" onclick="app.toggleTheme()">🌙</button>
    </div>

    <div class="action-bar">
        <div class="lang-selector-wrap">
            <img id="current-flag" class="lang-flag" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <select id="language-selector"></select>
        </div>

        <button id="wifi-action-btn" class="action-icon-btn wifi-btn" onclick="app.toggleWifiModal()" type="button" aria-label="WiFi">
            <svg viewBox="0 0 24 24"><path d="M5 12a13 13 0 0 1 14 0"/><path d="M9 16a7 7 0 0 1 6 0"/><path d="M13 20h.01"/></svg>
        </button>
        
        <button class="action-icon-btn pdf-btn" onclick="app.printFullMenu()">PDF</button>

        <div id="contact-icons-container" style="display:contents;"></div>
    </div>

    <div id="search-controls-shell" class="search-controls-shell">
        <div class="search-and-tabs">
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" class="search-input" oninput="app.handleSearch(this.value)">
                <button type="button" id="filter-toggle-btn" class="filter-toggle-btn" onclick="app.toggleFilterPanel()" aria-label="Filtrar platos">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M7 12h10"/><path d="M10 19h4"/></svg>
                </button>
            </div>
            <div id="filter-bar-container" class="filter-bar-container"></div>
            <div id="category-tabs-container" class="category-tabs-container">
                <div id="category-tabs" class="category-tabs"></div>
            </div>
        </div>
    </div>
</header>

<div id="main-content">
    <div id="loader"></div>
</div>

<div id="print-container"></div>

<div id="dish-modal" class="modal-overlay" onclick="app.closeModal(event)">
    <div class="modal-content">
        <button id="modal-close" class="modal-close" onclick="app.closeModal(event, true)">✕</button>
        <div id="modal-img-wrapper" class="modal-img-wrapper">
            <img id="modal-img" class="modal-img" src="" alt="">
        </div>
        <div class="modal-body">
            <h3 id="modal-title" class="modal-title"></h3>
            <div id="modal-price" class="modal-price"></div>
            <p id="modal-desc" class="modal-desc"></p>
        </div>
    </div>
</div>

<div id="cookie-banner">
    <div id="cookie-text" class="cookie-text"></div>
    <button id="cookie-btn" class="btn-cookie" onclick="app.acceptCookies()"></button>
</div>

<div id="filter-modal" class="filter-modal-overlay" onclick="app.closeFilterModal(event)">
    <div class="filter-modal-content" onclick="event.stopPropagation()">
        <div class="filter-modal-header">
            <h3 class="filter-modal-title" id="filter-modal-title"></h3>
            <button type="button" class="filter-modal-close" onclick="app.closeFilterModal(event, true)">✕</button>
        </div>
        <div id="filter-modal-options" class="filter-modal-list"></div>
        <div class="filter-modal-footer">
            <button type="button" id="filter-apply-btn" class="filter-cta-btn primary" onclick="app.applyCurrentFiltersAndClose()"></button>
        </div>
    </div>
</div>

<!-- NUEVO MODAL DE CONFIRMACIÓN -->
<div id="confirmation-modal" class="modal-overlay" onclick="app.closeConfirmation()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-body" style="text-align: center;">
            <h3 id="conf-title" class="modal-title">¿Estás seguro?</h3>
            <p id="conf-msg" style="color: var(--text-muted-light); margin-bottom: 20px;"></p>
            <div style="display: flex; gap: 10px;">
                <button type="button" class="filter-cta-btn secondary" onclick="app.closeConfirmation()">Cancelar</button>
                <button type="button" class="filter-cta-btn primary" onclick="app.confirmAction()">Continuar</button>
            </div>
        </div>
    </div>
</div>

<div id="wifi-modal" class="modal-overlay" onclick="app.closeWifiModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="app.closeWifiModal(event, true)">✕</button>
        <div class="modal-body">
            <h3 id="wifi-modal-title" class="modal-title"></h3>
            <div id="wifi-modal-content" class="wifi-modal-content"></div>
        </div>
    </div>
</div>

<div id="cart-fab" class="cart-fab" onclick="app.openCart()">
    🛒
    <span id="cart-badge" class="cart-badge">0</span>
</div>

<div id="cart-modal" class="modal-overlay" onclick="app.closeCart(event)">
    <div class="modal-content">
        <button class="modal-close" onclick="app.closeCart(event, true)">✕</button>
        <div class="modal-body" style="text-align: left;">
            <h3 id="cart-modal-title" class="modal-title" style="text-align: center;"></h3>
            <div id="cart-items-container"></div>
            <div id="cart-total-container" style="text-align: right; font-size: 1.3em; font-weight: 800; margin: 16px 0; color: var(--text-light);">
                <span id="cart-total-label"></span> <span id="cart-total-price">0,00 €</span>
            </div>
            <div id="table-selector-container">
                <label id="cart-table-label" for="table-selector" style="font-size:0.85em; font-weight:600; color:var(--text-muted-light);"></label>
                <select id="table-selector" class="search-input" style="width: 100%; margin-top: 5px;"></select>
            </div>
            <div class="notes-section" style="margin-top: 16px;">
                <label id="order-notes-label" style="font-size:0.85em; font-weight:600; color:var(--text-muted-light);"></label>
                <textarea id="order-notes-input" class="search-input" rows="3" maxlength="140" style="margin-top: 6px; resize: vertical;" oninput="app.updateOrderNotes(this.value)"></textarea>
                <div id="order-notes-counter" style="font-size: 0.75em; color: var(--text-muted-light); text-align: right; margin-top: 4px;"></div>
                <div id="quick-notes-container" style="display:flex; flex-wrap:wrap; gap:8px; margin-top: 10px;"></div>
            </div>
            <button id="send-order-btn" class="btn-cookie" style="width: 100%; margin-top: 20px;" onclick="app.sendOrder()"></button>
        </div>
    </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
