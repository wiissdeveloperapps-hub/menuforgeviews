<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Menú Digital</title>
    
    <!-- Librerías de descompresión -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-light: #f8fafc;
            --card-light: #ffffff;
            --text-light: #0f172a;
            --text-muted-light: #64748b;
            --border-light: #e2e8f0;
            --accent: #4f46e5;
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --shadow-subtle: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 20px 40px -15px rgba(79, 70, 229, 0.12);
            --radius-main: 22px;
            --pill-bg: #f1f5f9;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-light);
            transition: background-color 0.5s ease, color 0.5s ease;
            -webkit-font-smoothing: antialiased;
        }

        body.dark-mode {
            --bg-light: #09090b;
            --card-light: #121215;
            --text-light: #f4f4f5;
            --text-muted-light: #a1a1aa;
            --border-light: #27272a;
            --shadow-subtle: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.8);
            --pill-bg: #27272a;
        }

        /* --- CABECERA PRINCIPAL --- */
        header {
            background-color: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 12px 18px 8px 18px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-light);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        body.dark-mode header { background-color: rgba(18, 18, 21, 0.88); }

        .header-top-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        #btn-back {
            background: rgba(79, 70, 229, 0.1); color: var(--accent); border: none;
            width: 38px; height: 38px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.3s ease; flex-shrink: 0; display: none;
        }
        #btn-back:hover { background: var(--accent); color: white; transform: scale(1.05); }

        #restaurant-logo {
            width: 45px; height: 45px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--accent); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); flex-shrink: 0;
        }

        #restaurant-name {
            font-size: 1.35em; margin: 0; font-weight: 800; letter-spacing: -0.02em;
            background: var(--accent-gradient); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; white-space: normal; line-height: 1.1;
            flex-grow: 1;
        }

        .btn-theme-header {
            background: var(--card-light); color: var(--text-light); border: 1px solid var(--border-light);
            width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow-subtle); flex-shrink: 0; margin-left: auto;
        }

        /* --- BARRA DE ACCIONES LIMPIA --- */
        .action-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            flex-wrap: nowrap;
            overflow-x: auto; /* Por si acaso en pantallas extremadamente pequeñas */
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .action-bar::-webkit-scrollbar { display: none; }

        .action-icon-btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 12px; background: var(--card-light); border: 1px solid var(--border-light);
            border-radius: 12px; font-weight: 700; color: var(--text-light);
            cursor: pointer; box-shadow: var(--shadow-subtle); transition: all 0.2s; flex-shrink: 0;
        }
        .action-icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); color: var(--accent); }
        .action-icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        
        /* Estilo específico y llamativo para el PDF */
        .action-icon-btn.pdf-btn { 
            background: #ef4444; 
            color: #ffffff; 
            border: none; 
            font-size: 0.9em;
            padding: 8px 16px;
        }
        .action-icon-btn.pdf-btn:hover { 
            background: #dc2626; 
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .lang-selector-wrap {
            display: flex; align-items: center; gap: 4px; padding: 7px 10px;
            border-radius: 12px; background: var(--card-light); border: 1px solid var(--border-light);
            cursor: pointer; box-shadow: var(--shadow-subtle); flex-shrink: 0;
        }
        .lang-flag { width: 18px; height: 13px; border-radius: 2px; object-fit: cover; }
        #language-selector {
            border: none; background: transparent; font-size: 0.85em; font-weight: 700;
            color: var(--text-light); font-family: inherit; cursor: pointer; outline: none; appearance: none;
        }

        /* --- TOAST FRIENDLY NOTIFICATION --- */
        #friendly-toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); color: #fff;
            padding: 12px 20px; border-radius: 16px; font-size: 0.9em; font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 10000; display: flex; align-items: center; gap: 10px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; pointer-events: none;
            max-width: 90%; text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        #friendly-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }

        /* --- BUSCADOR Y TABS --- */
        .search-and-tabs { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .search-container { position: relative; width: 100%; }
        .search-input {
            width: 100%; padding: 10px 16px 10px 38px; border-radius: 12px;
            border: 1px solid var(--border-light); background-color: var(--card-light);
            color: var(--text-light); font-family: inherit; font-size: 0.9em;
            outline: none; transition: all 0.3s ease; box-sizing: border-box; box-shadow: var(--shadow-subtle);
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted-light); width: 16px; height: 16px; }

        .category-tabs-container { width: 100%; display: none; }
        .category-tabs {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;
            -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .category-tab {
            padding: 6px 14px; border-radius: 12px; background-color: var(--card-light);
            color: var(--text-muted-light); font-weight: 600; font-size: 0.85em; cursor: pointer;
            white-space: nowrap; transition: all 0.3s ease; border: 1px solid var(--border-light); box-shadow: var(--shadow-subtle);
        }
        .category-tab:hover { color: var(--accent); border-color: rgba(79, 70, 229, 0.3); }
        .category-tab.active { background: var(--accent-gradient); color: #ffffff; border-color: transparent; box-shadow: 0 6px 15px -3px rgba(79, 70, 229, 0.4); transform: translateY(-1px); }

        /* --- CONTENIDO BENTO GRID --- */
        .menu-card, .dish {
            background-color: var(--card-light); border: 1px solid var(--border-light);
            box-shadow: var(--shadow-subtle); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, border-color 0.4s ease;
            position: relative; overflow: hidden;
        }
        .menu-card:hover, .dish:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); border-color: rgba(79, 70, 229, 0.35); }

        #main-content { padding: 24px 16px; max-width: 850px; margin: 0 auto; min-height: 70vh; padding-bottom: 90px; }
        #loader { text-align: center; padding: 50px; font-size: 1.1em; color: var(--text-muted-light); font-weight: 600; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 10px; }
        .menu-card { border-radius: var(--radius-main); cursor: pointer; height: 220px; }
        .menu-card-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .menu-card-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, transparent 100%); z-index: 2; display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box; }
        .menu-card:hover .menu-card-img { transform: scale(1.08); }
        .menu-card-title { color: #ffffff; font-size: 1.6em; font-weight: 800; margin: 0; letter-spacing: -0.02em; text-shadow: 0 4px 12px rgba(0,0,0,0.4); }

        .category { margin-bottom: 40px; }
        .category-title { font-size: 1.5em; font-weight: 800; color: var(--text-light); display: inline-block; position: relative; margin-bottom: 20px; letter-spacing: -0.02em; }
        .category-title::after { content: ''; position: absolute; left: 0; bottom: -6px; width: 40px; height: 3px; background: var(--accent-gradient); border-radius: 4px; }

        .dish { display: flex; gap: 16px; border-radius: var(--radius-main); margin-bottom: 16px; cursor: pointer; padding: 0; }
        .dish-img { width: 125px; height: 125px; object-fit: cover; flex-shrink: 0; border-radius: var(--radius-main) 0 0 var(--radius-main); }
        .dish-details { padding: 16px 16px 16px 0; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .dish:not(:has(.dish-img)) .dish-details { padding-left: 18px; }
        .dish-name { font-size: 1.15em; font-weight: 700; margin: 0 0 5px; color: var(--text-light); letter-spacing: -0.01em; }
        .dish-desc { color: var(--text-muted-light); margin: 0 0 10px; font-size: 0.9em; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .dish-bottom-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .dish-price { font-size: 1.3em; font-weight: 800; color: var(--text-light); letter-spacing: -0.02em; }
        
        .dish-add-btn { background: var(--accent-gradient); color: white; border: none; width: 38px; height: 38px; border-radius: 12px; font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 6px 15px -3px rgba(79, 70, 229, 0.4); }
        .dish-add-btn:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 10px 20px -3px rgba(79, 70, 229, 0.6); }

        .dish-action-icon { background: rgba(79, 70, 229, 0.08); color: var(--accent); border-radius: 12px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .dish:hover .dish-action-icon { background: var(--accent); color: #ffffff; transform: translateX(3px); }
        .dish-source-badge { font-size: 0.7em; background: rgba(0,0,0,0.05); padding: 3px 6px; border-radius: 6px; color: var(--text-muted-light); font-weight: 600; margin-left: 6px; }
        body.dark-mode .dish-source-badge { background: rgba(255,255,255,0.08); }

        .fade-in-slide { opacity: 0; transform: translateY(15px); transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-in-slide.visible { opacity: 1; transform: translateY(0); }

        /* --- MODALES Y CARRITO --- */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.35s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--card-light); border-radius: 28px; width: 90%; max-width: 420px; max-height: 85vh; overflow-y: auto; position: relative; transform: translateY(20px) scale(0.96); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 30px 60px rgba(0,0,0,0.3); border: 1px solid var(--border-light); }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(0, 0, 0, 0.05); color: var(--text-light); border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 0.95em; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        body.dark-mode .modal-close { background: rgba(255, 255, 255, 0.08); }
        .modal-close:hover { background: #ef4444; color: white; transform: scale(1.1); }
        
        .modal-img-wrapper { text-align: center; padding-top: 28px; }
        .modal-img { width: 150px; height: 150px; object-fit: cover; border-radius: 24px; box-shadow: var(--shadow-card); display: inline-block; border: 3px solid var(--card-light); }
        .modal-body { padding: 22px 28px 28px; text-align: center; }
        .modal-title { font-size: 1.6em; font-weight: 800; margin: 0 0 10px; line-height: 1.15; color: var(--text-light); }
        .modal-price { font-size: 1.5em; font-weight: 800; color: var(--accent); display: inline-block; padding: 6px 20px; background: rgba(79, 70, 229, 0.08); border-radius: 12px; margin-bottom: 18px; }
        .modal-desc { color: var(--text-muted-light); font-size: 1em; line-height: 1.5; margin: 0; }

        .cart-fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--accent-gradient); color: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 20px 30px -10px rgba(79, 70, 229, 0.5); cursor: pointer; z-index: 999; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: none; }
        .cart-fab:hover { transform: scale(1.1) rotate(5deg); }
        .cart-badge { position: absolute; top: -5px; right: -5px; background-color: #ef4444; color: white; border-radius: 50%; width: 24px; height: 24px; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 3px solid var(--bg-light); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0); }
        .cart-badge.visible { transform: scale(1); }

        #cart-items-container { max-height: 40vh; overflow-y: auto; margin: 14px 0; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); padding: 10px 0; }
        .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid var(--border-light); }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-name { font-weight: 600; flex-grow: 1; margin-right: 10px; font-size: 0.95em; }
        .cart-item-controls { display: flex; align-items: center; gap: 8px; user-select: none; }
        .cart-item-quantity { font-weight: 700; min-width: 20px; text-align: center; }
        .cart-item-price { font-weight: 700; color: var(--accent); min-width: 65px; text-align: right; }
        .quantity-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-light); background: var(--card-light); color: var(--text-light); font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .quantity-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

        #cookie-banner { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 -10px 30px rgba(0,0,0,0.08); padding: 16px 20px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; z-index: 9999; border-top: 1px solid var(--border-light); transform: translateY(100%); transition: transform 0.4s ease; }
        #cookie-banner.show { transform: translateY(0); }
        body.dark-mode #cookie-banner { background: rgba(18, 18, 21, 0.9); }
        .cookie-text { font-size: 0.85em; margin-right: 15px; color: var(--text-muted-light); }
        .btn-cookie { background: var(--accent-gradient); color: #fff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap; box-shadow: 0 6px 15px -3px rgba(79, 70, 229, 0.4); transition: transform 0.2s; }
        .btn-cookie:hover { transform: scale(1.03); }

        /* --- PDF PRINT --- */
        #print-container { display: none; }

        @media print {
            body * { visibility: hidden; }
            body { background: white !important; }
            #print-container, #print-container * { visibility: visible; }
            #print-container { position: absolute; left: 0; top: 0; width: 100%; display: block !important; color: black; }
            header, #main-content, .modal-overlay, #cookie-banner, .cart-fab, #friendly-toast { display: none !important; }
            
            .pdf-page-section { position: relative; width: 100%; min-height: 90vh; padding: 30px 40px; box-sizing: border-box; }
            .pdf-page-break { page-break-before: always; break-before: page; }
            .pdf-watermark-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60%; max-width: 450px; opacity: 0.04; filter: grayscale(100%); z-index: -1; pointer-events: none; }
            
            .pdf-header-top { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 2px solid #000; padding-bottom: 15px; }
            .pdf-header-top img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #000; }
            .pdf-header-top h1 { margin: 0; font-size: 26px; text-transform: uppercase; letter-spacing: 2px; color: #000; }
            .pdf-header-top p { margin: 5px 0 0 0; font-size: 13px; color: #444; }
            
            .pdf-menu-title-box { text-align: center; margin: 30px 0 20px; }
            .pdf-menu-title-box span { display: inline-block; padding: 6px 20px; border: 2px solid #4f46e5; color: #4f46e5; font-size: 18px; font-weight: 800; text-transform: uppercase; border-radius: 8px; }
            
            .pdf-cat-title { font-size: 16px; font-weight: bold; margin: 25px 0 10px 0; text-transform: uppercase; color: #222; }
            
            .pdf-dish-row { display: flex; align-items: flex-end; margin-bottom: 14px; page-break-inside: avoid; }
            .pdf-dish-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; margin-right: 12px; flex-shrink: 0; border: 1px solid #ddd; }
            .pdf-dish-info { flex-shrink: 0; max-width: 65%; }
            .pdf-dish-name { font-weight: bold; font-size: 14px; margin: 0; color: #000; }
            .pdf-dish-desc { font-size: 11px; color: #555; margin: 2px 0 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
            
            .pdf-dish-dots { flex-grow: 1; border-bottom: 2px dotted #ccc; margin: 0 10px; position: relative; top: -6px; }
            .pdf-dish-price { font-weight: bold; font-size: 14px; flex-shrink: 0; color: #000; }
        }
    </style>
</head>

<body>

<!-- TOAST FRIENDLY TRADUCIDO -->
<div id="friendly-toast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span id="toast-text"></span>
</div>

<header id="header-container" style="display:none;">
    <!-- FILA 1: Logo, Nombre Libre y Botón Tema -->
    <div class="header-top-row">
        <button id="btn-back" onclick="app.navigateHome()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <img id="restaurant-logo" src="" alt="Logo" style="display:none;">
        <h1 id="restaurant-name"></h1>
        <button id="btn-theme" class="btn-theme-header" onclick="app.toggleTheme()">🌙</button>
    </div>

    <!-- FILA 2: Barra de acciones -->
    <div class="action-bar">
        <div class="lang-selector-wrap">
            <img id="current-flag" class="lang-flag" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <select id="language-selector"></select>
        </div>
        
        <button class="action-icon-btn pdf-btn" onclick="app.printFullMenu()">PDF</button>

        <div id="contact-icons-container" style="display:contents;"></div>
    </div>

    <!-- FILA 3: Buscador y Pestañas -->
    <div class="search-and-tabs">
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-input" class="search-input" oninput="app.handleSearch(this.value)">
        </div>
        <div id="category-tabs-container" class="category-tabs-container">
            <div id="category-tabs" class="category-tabs"></div>
        </div>
    </div>
</header>

<div id="main-content">
    <div id="loader"></div>
</div>

<div id="print-container"></div>

<div id="dish-modal" class="modal-overlay" onclick="app.closeModal(event)">
    <div class="modal-content">

    async init() {
        // DETECCIÓN TEMPRANA DE IDIOMA PARA TRADUCIR EL LOADER ANTES DEL FETCH
        let rawBrowserLang = navigator.language.split('-')[0].toLowerCase();
        if (rawBrowserLang === 'zh') rawBrowserLang = 'cn';
        if (rawBrowserLang === 'ar') rawBrowserLang = 'sa';
        
        const supportedLangs = Object.keys(I18N);
        this.currentLang = supportedLangs.includes(rawBrowserLang) ? rawBrowserLang : 'en';

        const tInit = I18N[this.currentLang] || I18N['es'];
        document.getElementById('restaurant-name').textContent = tInit.loading;
        const loaderInit = document.getElementById('loader');
        if (loaderInit) loaderInit.textContent = tInit.preparing;

        const t = I18N[this.currentLang] || I18N['es'];
        
        try {
            const hash = window.location.hash.substring(1);
            if (!hash) throw new Error(t.invalidQR);

            let jsonData;
            if (hash.startsWith('pako:')) {
                jsonData = this.decompressPako(hash.substring(5));
            } else if (hash.startsWith('restaurant:')) {
                const id = hash.replace('restaurant:', '');
                jsonData = await this.fetchRemote(id, 'restaurants');
            } else if (hash.startsWith('remote:')) {
                const id = hash.replace('remote:', '');
                jsonData = await this.fetchRemote(id, 'menus');
            } else {
                jsonData = await this.fetchRemote(hash, 'restaurants');
            }

            if (!jsonData.menus) {
                this.data = {
                    restaurantInfo: {
                        nombre: jsonData.nombreRestaurante || '',
                        logoBase64: jsonData.logoRestaurante || '',
                        telefono: jsonData.telefonoRestaurante,
                        direccion: jsonData.direccionRestaurante,
                        email: jsonData.emailRestaurante,
                        currency: jsonData.currency || 'EUR'
                    },
                    menus: [jsonData] 
                };
            } else {
                this.data = jsonData;
            }

            this.setupUI();
        } catch (error) {
            console.error(error);
            const tErr = I18N[this.currentLang] || I18N['es'];
            this.dom.content.innerHTML = `<div style="text-align:center; padding: 50px; color: #ef4444;"><h3>${tErr.errorTitle}</h3><p>${error.message}</p></div>`;
        }
    },

    setupUI() {
        this.dom.header.style.display = 'flex';
        const rInfo = this.data.restaurantInfo || {};
        
        if (rInfo.logoBase64) {
            this.dom.logo.src = rInfo.logoBase64;
            this.dom.logo.style.display = 'block';
        } else {
            this.dom.logo.style.display = 'none';
        }

        if (rInfo.whatsappEnabled && rInfo.whatsappPhone && rInfo.tables?.length > 0) {
            this.whatsapp.enabled = true;
            this.whatsapp.phone = rInfo.whatsappPhone;
            this.whatsapp.msgLang = rInfo.whatsappMessageLang || 'es';
            this.tables = rInfo.tables;
            this.dom.cartFab.style.display = 'flex';
        }

        const firstMenu = this.data.menus[0];
        if (firstMenu) {
            this.dom.langSelect.innerHTML = '';
            const langsToRender = new Set(Object.keys(I18N));
            if (firstMenu.traducciones) {
                Object.keys(firstMenu.traducciones).forEach(l => langsToRender.add(l));
            }

            langsToRender.forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang;
                opt.textContent = firstMenu.traducciones?.[lang]?.meta?.languageName || lang.toUpperCase();
                this.dom.langSelect.appendChild(opt);
            });
            
            this.dom.langSelect.value = this.currentLang;
            this.updateFlag();
        }

        this.dom.langSelect.addEventListener('change', (e) => {
            this.currentLang = e.target.value;
            this.updateFlag();
            this.updateUITexts();
            this.refreshCurrentView();
        });

        this.updateUITexts(); 
        this.initCookies();
        this.navigateHome();
    },

    updateUITexts() {
        const t = I18N[this.currentLang] || I18N['es'];
        const t_wa = I18N_WHATSAPP[this.whatsapp.msgLang] || I18N_WHATSAPP['es'];
        const rInfo = this.data?.restaurantInfo || {};
        
        this.dom.searchInput.placeholder = t.search;
        this.dom.btnBack.title = t.back;
        this.dom.cartModalTitle.textContent = t.cartTitle;
        this.dom.cartTotalLabel.textContent = t.cartTotal;
        this.dom.cartTableLabel.textContent = t.cartTableLabel;
        this.dom.sendOrderBtn.textContent = t_wa.orderBtn;
        this.dom.cookieText.textContent = t.cookieMsg;
        this.dom.cookieBtn.textContent = t.cookieBtn;
        
        this.dom.name.textContent = rInfo.nombre || t.defaultRestaurant;
        this.dom.langSelect.setAttribute('aria-label', t.langSelect);

        // Renderizado de iconos de contacto con textos traducidos
        let iconsHtml = '';
        if (rInfo.telefono) {
            const cleanTel = this.escapeHTML(rInfo.telefono);
            iconsHtml += `<button class="action-icon-btn" onclick="app.triggerContactAction('tel', '${cleanTel}', '${t.toastTel}')" title="${t.btnPhone}"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>`;
        }
        if (rInfo.email) {
            const cleanEmail = this.escapeHTML(rInfo.email);
            iconsHtml += `<button class="action-icon-btn" onclick="app.triggerContactAction('email', '${cleanEmail}', '${t.toastEmail}')" title="${t.btnEmail}"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></button>`;
        }
        if (rInfo.direccion) {
            const cleanDir = this.escapeHTML(rInfo.direccion);
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(rInfo.direccion)}`;
            iconsHtml += `<button class="action-icon-btn" onclick="app.triggerContactAction('map', '${mapsUrl}', '${t.toastDir}')" title="${t.btnMap}"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></button>`;
        }
        this.dom.contactIconsContainer.innerHTML = iconsHtml;
    },

    triggerContactAction(type, value, toastMessage) {
        this.dom.toastText.textContent = `${toastMessage} ${value}`;
        this.dom.toast.classList.add('show');
        
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => {
            this.dom.toast.classList.remove('show');
        }, 3200);

        setTimeout(() => {
            if (type === 'tel') window.location.href = `tel:${value}`;
            else if (type === 'email') window.location.href = `mailto:${value}`;
            else if (type === 'map') window.open(value, '_blank');
        }, 600);
    },

    initCookies() {
        if (!localStorage.getItem('cookiesAccepted_MenuForge')) {
            setTimeout(() => this.dom.cookieBanner.classList.add('show'), 800);
        }
    },

    acceptCookies() {
        localStorage.setItem('cookiesAccepted_MenuForge', 'true');
        this.dom.cookieBanner.classList.remove('show');
    },

    navigateHome() {
        this.currentView = 'home';
        this.currentMenuId = null;
        this.dom.btnBack.style.display = 'none';
        this.dom.categoryTabsContainer.style.display = 'none';
        if (this.categoryTabsObserver) this.categoryTabsObserver.disconnect();
        
        if (this.searchQuery) {
            this.renderSearch();
        } else {
            this.renderHomeGrid();
        }
    },

    navigateToMenu(menuId) {
        this.currentView = 'menu';
        this.currentMenuId = menuId;
        this.dom.btnBack.style.display = 'flex';
        this.dom.searchInput.value = ''; 
        this.renderMenu(menuId);
    },

    refreshCurrentView() {
        if (this.searchQuery) this.renderSearch();
        else if (this.currentView === 'menu') this.renderMenu(this.currentMenuId);
        else this.renderHomeGrid();
    },

    getMenuTitle(menu) {
        const t = I18N[this.currentLang] || I18N['es'];
        const tipo = (menu.tipoMenu || menu.tipo || '').toLowerCase();
        
        if (tipo === 'diario') return t["menu_diario"] || "📅 Menú del Día";
        if (tipo === 'especial') return t["menu_especial"] || "⭐ Cartas Especiales";

        let trans = menu.traducciones?.[this.currentLang];
        if (!trans && menu.traducciones) {
            trans = menu.traducciones[Object.keys(menu.traducciones)[0]];
        }
        return trans?.nombreCarta || menu.nombreCarta || t.defaultMenu;
    },

    renderHomeGrid() {
        const menus = this.data.menus || [];
        const t = I18N[this.currentLang] || I18N['es'];
        
        if (menus.length === 0) {
            this.dom.content.innerHTML = `<div id="loader">${t.emptyMenu}</div>`;
            return;
        }

        if (menus.length === 1 && !this.searchQuery) {
            this.navigateToMenu(menus[0].id);
            this.dom.btnBack.style.display = 'none';
            return;
        }

        let html = '<div class="menu-grid">';
        menus.forEach(menu => {
            const tipo = (menu.tipoMenu || menu.tipo || 'normal').toLowerCase();
            const coverImg = DEFAULT_COVERS[tipo] || DEFAULT_COVERS.normal;
            const noCacheImg = `${coverImg}?t=${new Date().getTime()}`;
            const menuName = this.getMenuTitle(menu);

            html += `
                <div class="menu-card fade-in-slide" onclick="app.navigateToMenu('${menu.id}')">
                    <img class="menu-card-img" src="${noCacheImg}" alt="${this.escapeHTML(menuName)}" loading="lazy">
                    <div class="menu-card-overlay">
                        <h2 class="menu-card-title">${this.escapeHTML(menuName)}</h2>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        this.dom.content.innerHTML = html;
        this.initScrollAnimations();
        window.scrollTo(0,0);
    },

    getCategoryName(catKey, originalName) {
        const t = I18N[this.currentLang] || I18N['es'];
        if (catKey && t[catKey]) {
            return t[catKey];
        }
        return originalName;
    },

    renderMenu(menuId) {
        const menu = this.data.menus.find(m => m.id === menuId);
        if (!menu) return this.navigateHome();
        const t = I18N[this.currentLang] || I18N['es'];

        let trans = menu.traducciones?.[this.currentLang];
        if (!trans && menu.traducciones) {
            trans = menu.traducciones[Object.keys(menu.traducciones)[0]];
        }

        if (!trans || !trans.categorias || trans.categorias.length === 0) {
            this.dom.content.innerHTML = `<div id="loader">${t.emptyMenu}</div>`;
            this.dom.categoryTabs.innerHTML = '';
            this.dom.categoryTabsContainer.style.display = 'none';
            return;
        }

        this.dom.categoryTabsContainer.style.display = 'block';
        const images = menu.recursos?.imagenes || {};
        let html = '';
        let tabsHtml = '';

        for (let catIndex = 0; catIndex < trans.categorias.length; catIndex++) {
            const cat = trans.categorias[catIndex];
            const catKey = cat.key;
            const translatedCatName = this.getCategoryName(catKey, cat.nombre);
            
            const categorySlug = this.slugify(translatedCatName || cat.nombre);
            tabsHtml += `<div class="category-tab" data-target="${categorySlug}">${this.escapeHTML(translatedCatName)}</div>`;

            html += `<div id="${categorySlug}" class="category fade-in-slide">`;
            html += `<h2 class="category-title">${this.escapeHTML(translatedCatName)}</h2>`;
            if (cat.platos) {
                for (let dishIndex = 0; dishIndex < cat.platos.length; dishIndex++) {
                    const dish = cat.platos[dishIndex];
                    html += this.generateDishCardHTML(dish, images, null, menu.id, catIndex, dishIndex);
                }
            }
            html += `</div>`;
        }

        this.dom.categoryTabs.innerHTML = tabsHtml;
        
        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const targetId = tab.getAttribute('data-target');
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    const headerHeight = this.dom.header.offsetHeight;
                    const targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - headerHeight;
                    window.scrollTo({ top: targetPosition, behavior: 'smooth' });
                }
            });
        });

        if (this.categoryTabsObserver) this.categoryTabsObserver.disconnect();
        const observerOptions = {
            root: null,
            rootMargin: `-${this.dom.header.offsetHeight + 15}px 0px 0px 0px`,
            threshold: 0.6
        };
        this.categoryTabsObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const id = entry.target.getAttribute('id');
                const tab = document.querySelector(`.category-tab[data-target="${id}"]`);
                if (tab) tab.classList.toggle('active', entry.isIntersecting);
            });
        }, observerOptions);
        document.querySelectorAll('.category').forEach(section => this.categoryTabsObserver.observe(section));

        this.dom.content.innerHTML = html;
        this.initScrollAnimations();
        window.scrollTo(0,0);
    },

    handleSearch(query) {
        this.searchQuery = query.trim().toLowerCase();
        if (!this.searchQuery) {
            this.refreshCurrentView();
            return;
        }
        this.renderSearch();
    },

    renderSearch() {
        let resultsHTML = '';
        const foundKeys = new Set();
        const t = I18N[this.currentLang] || I18N['es'];

        this.dom.btnBack.style.display = 'flex';
        this.dom.categoryTabsContainer.style.display = 'none';
        if (this.categoryTabsObserver) this.categoryTabsObserver.disconnect();

        this.data.menus.forEach(menu => {
            if (!menu.traducciones) return;
            const images = menu.recursos?.imagenes || {};
            const displayMenuName = this.getMenuTitle(menu);

            for (const lang in menu.traducciones) {
                const trans = menu.traducciones[lang];
                if (trans && trans.categorias) {
                    for (let catIndex = 0; catIndex < trans.categorias.length; catIndex++) {
                        const cat = trans.categorias[catIndex];
                        if (cat.platos) {
                            for (let dishIndex = 0; dishIndex < cat.platos.length; dishIndex++) {
                                const dish = cat.platos[dishIndex];
                                const name = (dish.nombre || '').toLowerCase();
                                const desc = (dish.descripcion || '').toLowerCase();
                                
                                if (name.includes(this.searchQuery) || desc.includes(this.searchQuery)) {
                                    const key = `${menu.id}-${catIndex}-${dishIndex}`;
                                    if (!foundKeys.has(key)) {
                                        foundKeys.add(key);
                                        const displayDish = menu.traducciones[this.currentLang]?.categorias[catIndex]?.platos[dishIndex];
                                        if (displayDish) {
                                            resultsHTML += this.generateDishCardHTML(displayDish, images, displayMenuName, menu.id, catIndex, dishIndex);
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        });

        if (foundKeys.size === 0) {
            this.dom.content.innerHTML = `<div id="loader">${t.emptySearch} "${this.escapeHTML(this.searchQuery)}"</div>`;
        } else {
            this.dom.content.innerHTML = `
                <div class="category fade-in-slide">
                    <h2 class="category-title">${t.results} (${foundKeys.size})</h2>
                    ${resultsHTML}
                </div>
            `;
            this.initScrollAnimations();
        }
    },

    generateDishCardHTML(dish, images, sourceMenuName, menuId, catIndex, dishIndex) {
        const imgUrl = dish.idImagen ? images[dish.idImagen] : '';
        const safeName = this.escapeHTML(dish.nombre);
        const safeDesc = this.escapeHTML(dish.descripcion);
        const safePrice = this.formatPrice(dish.precio);

        const modalData = { name: safeName, desc: safeDesc, price: safePrice, imgUrl };
        const safeModalData = encodeURIComponent(JSON.stringify(modalData));

        let cartDishData = dish;
        if (this.whatsapp.enabled && menuId !== undefined) {
            const menu = this.data.menus.find(m => m.id === menuId);
            const waDish = menu?.traducciones[this.whatsapp.msgLang]?.categorias[catIndex]?.platos[dishIndex];
            if (waDish) {
                cartDishData = {
                    ...dish,
                    nombre_display: dish.nombre,
                    nombre_wa: waDish.nombre,
                    cart_id: `${menuId}-${catIndex}-${dishIndex}`
                };
            }
        }
        const safeCartData = encodeURIComponent(JSON.stringify(cartDishData));

        const actionButton = this.whatsapp.enabled
            ? `<button class="dish-add-btn" onclick="event.stopPropagation(); app.addToCart('${safeCartData}');">+</button>`
            : `<div class="dish-action-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div>`;

        return `
            <div class="dish" onclick="app.openModal('${safeModalData}')">
                ${imgUrl ? `<img class="dish-img" src="${imgUrl}" loading="lazy">` : ''}
                <div class="dish-details">
                    <div class="dish-name">${safeName}</div>
                    ${safeDesc ? `<p class="dish-desc">${safeDesc}</p>` : ''}
                    <div class="dish-bottom-row">
                        <div class="dish-price">${safePrice} ${sourceMenuName ? `<span class="dish-source-badge">${this.escapeHTML(sourceMenuName)}</span>` : ''}</div>
                        ${actionButton}
                    </div>
                </div>
            </div>
        `;
    },

    printFullMenu() {
        const rInfo = this.data?.restaurantInfo || {};
        const menus = this.data?.menus || [];
        const t = I18N[this.currentLang] || I18N['es'];
        let printHTML = '';

        menus.forEach((menu, index) => {
            const menuName = this.getMenuTitle(menu);
            const breakClass = index > 0 ? 'pdf-page-break' : '';
            printHTML += `<div class="pdf-page-section ${breakClass}">`;
            
            if (rInfo.logoBase64) {
                printHTML += `<img src="${rInfo.logoBase64}" class="pdf-watermark-bg">`;
            }

            printHTML += `
                <div class="pdf-header-top">
                    ${rInfo.logoBase64 ? `<img src="${rInfo.logoBase64}">` : ''}
                    <h1>${this.escapeHTML(rInfo.nombre || t.defaultRestaurant)}</h1>
                    <p>${this.escapeHTML(rInfo.direccion || '')} &bull; ${this.escapeHTML(rInfo.telefono || '')}</p>
                </div>
                <div class="pdf-menu-title-box">
                    <span>${this.escapeHTML(menuName)}</span>
                </div>
            `;
            
            let trans = menu.traducciones?.[this.currentLang] || menu.traducciones[Object.keys(menu.traducciones)[0]];
            const images = menu.recursos?.imagenes || {};

            if (trans && trans.categorias) {
                trans.categorias.forEach(cat => {
                    const catName = this.getCategoryName(cat.key, cat.nombre);
                    printHTML += `<div class="pdf-cat-title">${this.escapeHTML(catName)}</div>`;
                    
                    if (cat.platos) {
                        cat.platos.forEach(dish => {
                            const priceFormatted = this.formatPrice(dish.precio);
                            const imgUrl = dish.idImagen ? images[dish.idImagen] : '';
                            
                            printHTML += `
                                <div class="pdf-dish-row">
                                    ${imgUrl ? `<img src="${imgUrl}" class="pdf-dish-thumb">` : ''}
                                    <div class="pdf-dish-info">
                                        <p class="pdf-dish-name">${this.escapeHTML(dish.nombre)}</p>
                                        ${dish.descripcion ? `<p class="pdf-dish-desc">${this.escapeHTML(dish.descripcion)}</p>` : ''}
                                    </div>
                                    <div class="pdf-dish-dots"></div>
                                    <div class="pdf-dish-price">${priceFormatted}</div>
                                </div>
                            `;
                        });
                    }
                });
            }
            printHTML += `</div>`;
        });

        this.dom.printContainer.innerHTML = printHTML;
        setTimeout(() => { window.print(); }, 100);
    },

    openModal(safeDataStr) {
        const data = JSON.parse(decodeURIComponent(safeDataStr));
        const t = I18N[this.currentLang] || I18N['es'];
        
        this.dom.mTitle.innerHTML = data.name;
        this.dom.mPrice.innerHTML = data.price;
        this.dom.mDesc.innerHTML = data.desc || `<i>${t.noDescription}</i>`;
        
        if (data.imgUrl) {
            this.dom.mImg.src = data.imgUrl;
            this.dom.mImgWrapper.style.display = 'block';
        } else {
            this.dom.mImg.src = '';
            this.dom.mImgWrapper.style.display = 'none';
        }

        this.dom.modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    },

    closeModal(event, force = false) {
        if (force || event.target === this.dom.modal) {
            this.dom.modal.classList.remove('active');
            document.body.style.overflow = '';
        }
    },

    addToCart(safeCartData) {
        const dish = JSON.parse(decodeURIComponent(safeCartData));
        const uniqueId = dish.cart_id || dish.nombre;
        const existingItem = this.cart.find(item => (item.cart_id || item.nombre) === uniqueId);

        if (existingItem) {
            existingItem.quantity++;
        } else {
            this.cart.push({ ...dish, quantity: 1 });
        }
        this.updateCartBadge();
    },

    updateCartBadge() {
        const totalItems = this.cart.reduce((sum, item) => sum + item.quantity, 0);
        this.dom.cartBadge.textContent = totalItems;
        if (totalItems > 0) {
            this.dom.cartBadge.classList.add('visible');
        } else {
            this.dom.cartBadge.classList.remove('visible');
        }
    },

    openCart() {
        if (!this.whatsapp.enabled) return;
        this.renderCartModal();
        this.dom.cartModal.classList.add('active');
        document.body.style.overflow = 'hidden';
    },

    closeCart(event, force = false) {
        if (force || event.target === this.dom.cartModal) {
            this.dom.cartModal.classList.remove('active');
            document.body.style.overflow = '';
        }
    },

    renderCartModal() {
        const t = I18N[this.currentLang] || I18N['es'];
        let tableOptions = `<option value="">-- ${t.tableSelectDefault} --</option>`;
        const displayLang = this.currentLang;
        const valueLang = this.whatsapp.msgLang;

        this.tables.forEach(table => {
            const displayTableName = table.traducciones?.[displayLang] || table.name;
            const valueTableName = table.traducciones?.[valueLang] || table.name;
            tableOptions += `<option value="${this.escapeHTML(valueTableName)}">${this.escapeHTML(displayTableName)}</option>`;
        });
        this.dom.tableSelector.innerHTML = tableOptions;

        if (this.cart.length === 0) {
            this.dom.cartItemsContainer.innerHTML = `<div style="text-align:center; padding: 20px 0; color: var(--text-muted-light);">${t.cartEmpty}</div>`;
            this.updateCartTotal();
            return;
        }

        let itemsHtml = '';
        this.cart.forEach(item => {
            const uniqueId = this.escapeHTML(item.cart_id || item.nombre);
            const displayName = this.escapeHTML(item.nombre_display || item.nombre);

            itemsHtml += `
                <div class="cart-item">
                    <div class="cart-item-name">${displayName}</div>
                    <div class="cart-item-controls">
                        <button class="quantity-btn" onclick="app.adjustCartQuantity('${uniqueId}', -1)">-</button>
                        <span class="cart-item-quantity">${item.quantity}</span>
                        <button class="quantity-btn" onclick="app.adjustCartQuantity('${uniqueId}', 1)">+</button>
                    </div>
                    <div class="cart-item-price">${this.formatPrice(item.precio * item.quantity)}</div>
                </div>
            `;
        });
        this.dom.cartItemsContainer.innerHTML = itemsHtml;
        this.updateCartTotal();
    },

    adjustCartQuantity(itemId, change) {
        const item = this.cart.find(i => (this.escapeHTML(i.cart_id || i.nombre)) === itemId);
        if (item) {
            item.quantity += change;
            if (item.quantity <= 0) {
                this.cart = this.cart.filter(i => (this.escapeHTML(i.cart_id || i.nombre)) !== itemId);
            }
        }
        this.renderCartModal();
        this.updateCartBadge();
    },

    updateCartTotal() {
        const total = this.cart.reduce((sum, item) => sum + (item.precio * item.quantity), 0);
        this.dom.cartTotalPrice.textContent = this.formatPrice(total);
    },

    sendOrder() {
        const selectedTable = this.dom.tableSelector.value;
        const t_wa = I18N_WHATSAPP[this.whatsapp.msgLang] || I18N_WHATSAPP['es'];
        if (!selectedTable) { alert(t_wa.noTable); return; }
        if (this.cart.length === 0) return;

        const orderItems = this.cart.map(item => {
            const nameForWhatsapp = item.nombre_wa || item.nombre;
            return t_wa.item.replace('{quantity}', item.quantity).replace('{name}', nameForWhatsapp);
        }).join('\n');
        let message = `${t_wa.header.replace('{table}', selectedTable)}\n\n${orderItems}\n\n${t_wa.footer}`;
        window.open(`https://wa.me/${this.whatsapp.phone}?text=${encodeURIComponent(message)}`, '_blank');
    },

    updateFlag() { 
        this.dom.currentFlag.src = `assets/flags/${this.currentLang}.png`; 
    },
    
    toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.getElementById('btn-theme').textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    },
    
    formatPrice(price) {
        if (typeof price !== 'number') return '';
        const currencyCode = (this.data && this.data.restaurantInfo && this.data.restaurantInfo.currency) 
                            ? this.data.restaurantInfo.currency 
                            : 'EUR';
        
        let locale = this.currentLang;
        if (locale === 'cn') locale = 'zh-CN';
        else if (locale === 'sa') locale = 'ar-SA';
        else if (locale === 'en') locale = 'en-US';
        else if (locale === 'pt') locale = 'pt-BR';

        try {
            return price.toLocaleString(locale, { style: 'currency', currency: currencyCode });
        } catch(e) {
            return price.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
        }
    },
    
    escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, match => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[match]));
    },

    slugify(text) {
        if (!text) return '';
        return text.toString().toLowerCase()
            .replace(/\s+/g, '-')          
            .replace(/[^\w\-]+/g, '')      
            .replace(/\-\-+/g, '-')        
            .replace(/^-+/, '')            
            .replace(/-+$/, '');            
    },

    initScrollAnimations() {
        const elements = document.querySelectorAll('.fade-in-slide');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.01 });
        elements.forEach(el => observer.observe(el));
    },

    decompressPako(base64String) {
        const compressed = atob(base64String).split('').map(c => c.charCodeAt(0));
        return JSON.parse(pako.inflate(new Uint8Array(compressed), { to: 'string' }));
    },

    async fetchRemote(id, folder) {
        const workerUrl = window.location.hostname.includes('github.io') || window.location.hostname === 'localhost' 
            ? 'https://wiissdeveloperapps.dpdns.org' 
            : ''; 

        const url = `${workerUrl}/${folder}/${id}.json?t=${Date.now()}`;
        const response = await fetch(url);
        const t = I18N[this.currentLang] || I18N['es'];
        if (!response.ok) throw new Error(t.fetchError);
        
        const rawText = await response.text();
        const decompressed = LZString.decompressFromEncodedURIComponent(rawText);
        return JSON.parse(decompressed || rawText);
    }
};

document.addEventListener('DOMContentLoaded', () => app.init());
</script>
